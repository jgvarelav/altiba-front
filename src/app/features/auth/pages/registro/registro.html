<div class="mx-auto flex max-w-md flex-col px-4 py-16 sm:px-6">
  <h1 class="text-2xl font-bold text-altiba-dark">Crear cuenta</h1>
  <p class="mt-1 text-sm text-gray-500">Únete a la red de Altiba Conecta Lab.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 flex flex-col gap-4">
    <div>
      <label for="username" class="mb-1 block text-sm font-medium text-altiba-dark">Usuario</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-altiba-dark focus:border-altiba-green focus:outline-none"
      />
    </div>

    <div>
      <label for="email" class="mb-1 block text-sm font-medium text-altiba-dark">Correo</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-altiba-dark focus:border-altiba-green focus:outline-none"
      />
    </div>

    <div>
      <label for="password" class="mb-1 block text-sm font-medium text-altiba-dark">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-altiba-dark focus:border-altiba-green focus:outline-none"
      />
    </div>

    @if (errorMessage()) {
      <p class="text-sm text-red-600">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="mt-2 rounded-full bg-altiba-green px-5 py-2.5 text-sm font-semibold text-white hover:bg-altiba-green-dark disabled:opacity-60"
    >
      {{ loading() ? 'Creando cuenta...' : 'Registrarme' }}
    </button>
  </form>

  <p class="mt-6 text-sm text-gray-500">
    ¿Ya tienes cuenta?
    <a [routerLink]="['/', 'login']" class="font-medium text-altiba-green hover:underline"
      >Inicia sesión</a
    >
  </p>
</div>
