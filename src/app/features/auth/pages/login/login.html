<div class="mx-auto flex max-w-md flex-col px-4 py-16 sm:px-6">
  <h1 class="text-2xl font-bold text-altiba-dark">Iniciar sesión</h1>
  <p class="mt-1 text-sm text-gray-500">Entra a tu cuenta de Altiba Conecta Lab.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 flex flex-col gap-4">
    <div>
      <label for="identifier" class="mb-1 block text-sm font-medium text-altiba-dark"
        >Usuario o correo</label
      >
      <input
        id="identifier"
        type="text"
        formControlName="identifier"
        class="w-full rounded-lg form-field px-3 py-2 text-sm text-altiba-dark"
      />
    </div>

    <div>
      <div class="mb-1 flex items-baseline justify-between">
        <label for="password" class="block text-sm font-medium text-altiba-dark">Contraseña</label>
        <a
          [routerLink]="['/', 'olvide-contrasena']"
          class="text-xs font-medium text-altiba-green hover:underline"
          >¿Olvidaste tu contraseña?</a
        >
      </div>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="w-full rounded-lg form-field px-3 py-2 text-sm text-altiba-dark"
      />
    </div>

    @if (errorMessage()) {
      <p class="text-sm text-red-600">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="mt-2 rounded-full btn-primary px-5 py-2.5 text-sm font-semibold text-white"
    >
      {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
    </button>
  </form>

  <p class="mt-6 text-sm text-gray-500">
    ¿No tienes cuenta?
    <a [routerLink]="['/', 'registro']" class="font-medium text-altiba-green hover:underline"
      >Regístrate</a
    >
  </p>
</div>
