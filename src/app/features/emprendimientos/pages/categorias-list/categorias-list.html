<section class="relative overflow-hidden bg-altiba-banner">
  <div class="pointer-events-none absolute -right-24 -top-24 h-72 w-72 rounded-full bg-altiba-green/10 blur-3xl"></div>

  <div class="relative mx-auto max-w-4xl px-4 py-16 text-center sm:px-6 lg:px-8">
    <p class="text-sm font-semibold uppercase tracking-wide text-altiba-green">Emprendimientos</p>
    <h1 class="mt-2 text-3xl font-extrabold text-white sm:text-4xl">Todas las categorías</h1>
    <p class="mx-auto mt-4 max-w-2xl text-lg text-white/80">
      Elige una categoría para ver sus emprendimientos.
    </p>
  </div>
</section>

<div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
  <div class="grid grid-cols-2 gap-6 sm:grid-cols-3 lg:grid-cols-5">
    @for (categoria of categorias(); track categoria.slug; let i = $index) {
      <a
        [routerLink]="['/', 'emprendimientos']"
        [queryParams]="{ categoria: categoria.slug }"
        [appScrollReveal]="(i % 5) * 70"
        class="group flex flex-col items-center gap-3 rounded-2xl border border-gray-100 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-altiba-green/30 hover:shadow-lg"
      >
        <span
          class="grid h-16 w-16 place-items-center rounded-full text-2xl text-white shadow-md transition-transform duration-200 group-hover:scale-110"
          [style.background-color]="categoria.color"
        >
          <fa-icon [icon]="categoriaIcon(categoria.icono)" />
        </span>
        <p class="font-medium text-altiba-dark transition-colors group-hover:text-altiba-green">
          {{ categoria.nombre }}
        </p>
      </a>
    }
  </div>
</div>
