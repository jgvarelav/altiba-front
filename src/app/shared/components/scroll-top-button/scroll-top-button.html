<button
  type="button"
  (click)="scrollToTop()"
  aria-label="Volver arriba"
  class="fixed bottom-6 right-6 z-30 grid h-11 w-11 place-items-center rounded-full btn-primary text-white shadow-altiba-green/30 transition-all duration-300 hover:-translate-y-1 active:scale-95"
  [class.opacity-0]="!visible()"
  [class.pointer-events-none]="!visible()"
  [class.translate-y-3]="!visible()"
  [class.opacity-100]="visible()"
  [class.translate-y-0]="visible()"
>
  <fa-icon [icon]="faArrowUp" />
</button>
